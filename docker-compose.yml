services:
  postgres:
    image: postgres:17
    container_name: fcg-users-postgres
    environment:
      POSTGRES_DB: users
      POSTGRES_USER: fcg_user
      POSTGRES_PASSWORD: fcg_password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg_user -d users"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management
    container_name: fcg-users-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: fcg_user
      RABBITMQ_DEFAULT_PASS: fcg_password
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  users-api:
    image: igoranthony12/users-api:latest
    build:
      context: .
      dockerfile: src/FCG.Api/Dockerfile
    container_name: fcg-users-api
    ports:
      - "8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=users;Username=fcg_user;Password=fcg_password"
      RabbitMQ__Host: "rabbitmq"
      RabbitMQ__VirtualHost: "/"
      RabbitMQ__Username: "fcg_user"
      RabbitMQ__Password: "fcg_password"
      Jwt__Issuer: "FCGames"
      Jwt__Key: "ChaveSuperSecretaECompridaDeExemplo123!"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
